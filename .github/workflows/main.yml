name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Compile firmware
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh Fusion
        mkdir -p compiled-firmware
        cp build/Fusion/f4hwn.fusion.bin compiled-firmware/
        cp build/Fusion/f4hwn.fusion.hex compiled-firmware/

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4hwn-fusion-cn-firmware
        path: compiled-firmware/
